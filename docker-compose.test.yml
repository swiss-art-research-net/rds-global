services:

  search-evaluation:
    build: ./services/search-evaluation
    container_name: ${COMPOSE_PROJECT_NAME:-rds}-search-evaluation
    depends_on:
      - opensearch-connector
    networks:
      - internal
    volumes:
      - ./services/search-evaluation/run_search_eval.py:/app/run_search_eval.py:ro
      - ./services/search-evaluation/output:/output
      - ./services/search-evaluation/tests:/tests:ro
    environment:
      SEARCH_EVAL_BASE_URL: http://opensearch-connector:8000
      SEARCH_EVAL_INPUT: /tests/search-evaluation-template.csv
      SEARCH_EVAL_OUTPUT: /output/search-evaluation-results.csv
      SEARCH_EVAL_HTML_OUTPUT: /output/search-evaluation-results.html
      SEARCH_EVAL_LIMIT: ${SEARCH_EVAL_LIMIT:-100}
      SEARCH_EVAL_TIMEOUT: ${SEARCH_EVAL_TIMEOUT:-30}
      SEARCH_EVAL_RETRIES: ${SEARCH_EVAL_RETRIES:-5}
      SEARCH_EVAL_DATASET: ${SEARCH_EVAL_DATASET:-}
