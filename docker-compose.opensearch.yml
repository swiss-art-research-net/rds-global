---
services:

  opensearch-connector:
    build: ./services/opensearch-connector
    container_name: ${COMPOSE_PROJECT_NAME}-opensearch-connector
    volumes:
      - ./config:/config
    command: ["--opensearch-url", "http://opensearch-node:9200", "--index", "rds-entities", "--port", "8000", "--config", "/config/datasets.yml"]

  opensearch-node:
    image: opensearchproject/opensearch:latest
    container_name: ${COMPOSE_PROJECT_NAME}-opensearch-node
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"      
      - "DISABLE_INSTALL_DEMO_CONFIG=true" # Prevents execution of bundled demo script which installs demo certificates and security configurations to OpenSearch
      - "DISABLE_SECURITY_PLUGIN=true" # Disables Security plugin
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - ./binds/opensearch-data:/usr/share/opensearch/data:rw
    ports:
      - 9200:9200
      - 9600:9600  # required for Performance Analyzer
  opensearch-dashboard:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: ${COMPOSE_PROJECT_NAME}-opensearch-dashboard
    ports:
      - 5601:5601
    expose:
      - '5601'
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: true