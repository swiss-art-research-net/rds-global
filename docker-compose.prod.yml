services:
  jobs:
    restart: unless-stopped

  opensearch-connector:
    restart: unless-stopped

  opensearch-node:
    restart: unless-stopped
  opensearch-dashboard:
    restart: unless-stopped

  platform:
    restart: unless-stopped
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      LETSENCRYPT_HOST: ${HOST_NAME}
      VIRTUAL_HOST: ${HOST_NAME}
      VIRTUAL_PORT: 8080
      CONTENT_SECURITY_POLICY: "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: ; img-src 'self' https: data: blob:; connect-src 'self'; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com;"
    networks:
      - internal
      - proxy
      
  qlever:
    restart: unless-stopped
  

networks:
  proxy:
    name: ${PROXY_NETWORK_NAME}
    external: true
