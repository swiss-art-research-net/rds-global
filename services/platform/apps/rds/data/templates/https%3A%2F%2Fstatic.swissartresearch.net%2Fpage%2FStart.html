<h2>Welcome to RDS</h2>


<semantic-search
    limit='100'
    id='search-browse'
>
    <semantic-search-query-keyword 
        min-search-term-length='3' 
        debounce='600'
        tokenize-lucene-query='false'
        query='SELECT DISTINCT ?subject WHERE {
                   SERVICE <http://platform:8080/sparql?repository=opensearch> {
                        ?query os:search ?__token__ ;
                            os:hasTypeClass ?typeClass ;
                            os:hasScore ?score ;
                            os:hasSubject ?subject ;
                            os:hasDataset "aat" ;
                            os:hasDescription ?description ;
                            os:hasReference ?reference ;
                            os:hasPrefLabel ?prefLabel .
                        }
                }
    '>
    </semantic-search-query-keyword>
    <semantic-search-result-holder>
        <semantic-search-result>
            <semantic-table 
                id='grid-result'
                query='SELECT DISTINCT ?prefLabel ?subject ?description ?typeClass ?dataset ?reference ?score WHERE {
                    
                } GROUP BY ?subject ?description ?prefLabel ?typeClass ?dataset ?reference ?score
                ORDER BY DESC(?score) ?reference'
                number-of-displayed-rows="50"
                options='{
                    "showFilter": false
                }'
                no-result-template="Nothing found"
                column-configuration='[
                    {
                        "variableName": "prefLabel",
                        "displayName": "Label",
                        "cellTemplate": "{{> prefLabelTemplate}}"                        
                    },
                    {
                        "variableName": "description",
                        "displayName": "Description"
                    },
                    {
                        "variableName": "typeClass",
                        "displayName": "Type Class"
                    },
                    {
                        "variableName": "dataset",
                        "displayName": "Dataset"
                    },
                    {
                        "variableName": "reference",
                        "displayName": "Reference"
                    },
                    {
                        "variableName": "matches",
                        "displayName": "Matches",
                        "cellTemplate": "{{> matchesTemplate}}"
                    },
                    {
                        "variableName": "score",
                        "displayName": "Score"
                    }
                ]'
            >    
                <template id="prefLabelTemplate">
                    <semantic-link iri="{{subject.value}}">{{prefLabel.value}}</semantic-link>
                </template>
                <template id="matchesTemplate">
                    <semantic-query
                        query='SELECT DISTINCT ?match WHERE {
                            BIND(<{{subject.value}}> AS ?subject)
                            ?subject rds:related ?match .
                            GRAPH ?g {
                                ?match a ?type .
                            }
                        }'
                    ></semantic-query>
                </template>
            </semantic-table>
        </semantic-search-result>
    </semantic-search-result-holder>
</semantic-search>
