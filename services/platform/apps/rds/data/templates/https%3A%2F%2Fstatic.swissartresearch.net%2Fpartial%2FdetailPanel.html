<div class="detail-panel" hidden>
  <mp-event-target-template-render id="detail-panel" template="{{> detail-panel-state}}">
    <template id="detail-panel-state">
      <rds-panel-selection hidden current="{{subjectUri}}" rows="{{stringify rows}}" member-count="{{memberCount}}"></rds-panel-selection>
    </template>
  </mp-event-target-template-render>
  <mp-event-target-template-render id="detail-panel-header" template="{{> detail-panel-header}}">
    <template id="detail-panel-header">
      {{#if subjectUri}}
        <div class="detail-panel-section detail-panel-header">
          <div class="detail-panel-heading">
            <h3>{{prefLabel}}</h3>
            <div class="detail-panel-uri"><span>URI: </span><rds-copy-popover uri="{{subjectUri}}" record-id="{{recordId}}" rds-record="true">{{subjectUri}}</rds-copy-popover></div>
          </div>
          <mp-event-trigger
            type="Component.TemplateUpdate"
            targets='["detail-panel","detail-panel-header","detail-panel-content","detail-panel-footer"]'
            data='{}'>
            <rds-record-deselect class="detail-close">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.4985 0L10.0005 8.49798L1.50255 0L0 1.50202L8.49851 10L0 18.498L1.50255 20L10.0005 11.502L18.4985 20L20.0011 18.498L11.5025 10L20.0011 1.50202L18.4985 0Z" fill="currentColor"/>
              </svg>
            </rds-record-deselect>
          </mp-event-trigger>
        </div>
      {{/if}}
    </template>
  </mp-event-target-template-render>
  <div class="detail-panel-graph is-closed" hidden>
    <rds-panel-graph hidden></rds-panel-graph>
    <button type="button" class="detail-panel-graph-toggle" aria-label="Graph" aria-expanded="false">
      <svg width="17" height="10" viewBox="0 0 24 14" aria-hidden="true">
        <polyline points="2,2 12,12 22,2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
    <div class="detail-panel-graph-map">
      [[> partial:groupLinkMap]]
    </div>
    <div class="detail-panel-graph-badges">
      <mp-event-target-template-render id="detail-panel-graph-badges" template="{{> detail-panel-graph-badges}}">
        <template id="detail-panel-graph-badges">
          <div class="detail-panel-graph-badge-list">
            {{#each rows}}
              <button type="button" class="rds-badge" data-ds="{{dataset.value}}" data-uri="{{subject.value}}" aria-label="Show {{dataset.value}} record {{prefLabel.value}}">
                <rds-dataset-label key="{{dataset.value}}"></rds-dataset-label>
              </button>
            {{/each}}
          </div>
        </template>
      </mp-event-target-template-render>
    </div>
    <span class="rds-link-map-events" hidden></span>
  </div>
  <div class="detail-panel-content">
    <mp-event-target-template-render id="detail-panel-content" template="{{> detail-panel-content}}">
      <template id="detail-panel-content">
        {{#if subjectUri}}
          <div>
            <div class="detail-panel-section detail-panel-summary">
              <div class="detail-row">
                <span class="detail-property">Dataset</span>
                <span class="detail-value">
                  <rds-copy-popover uri="{{subjectUri}}" record-id="{{recordId}}" rds-record="true">
                    <button type="button" class="rds-badge" data-ds="{{dataset}}">
                      <rds-dataset-label key="{{dataset}}"></rds-dataset-label>
                    </button>
                  </rds-copy-popover>
                </span>
              </div>
              <div class="detail-row">
                <span class="detail-property">RDS type</span>
                <span class="detail-value">{{rdsType}}</span>
              </div>
              <div class="detail-row">
                <span class="detail-property">Source type(s)</span>
                <span class="detail-value">
                  {{#each sourceTypes}}
                    <span><mp-label iri="{{this}}"></mp-label>{{#unless @last}}, {{/unless}}</span>
                  {{/each}}
                </span>
              </div>
            </div>

            {{#ifCond dataset "==" "gnd"}}
              <semantic-query query='[[> partial:queryGnd subject="{{subjectUri}}"]]' template="{{> detail-fields}}" no-result-template="">
                [[> detailFieldsTemplate]]
              </semantic-query>
            {{/ifCond}}

            {{#if localMatches}}
              <semantic-query
                query='SELECT ?related ?datasetKey ?external ?groupNode (GROUP_CONCAT(DISTINCT STR(?label); SEPARATOR="|||") AS ?labels) WHERE {
                  VALUES ?related {
                    {{#each localMatches}}
                      <{{this}}>
                    {{/each}}
                  }
                  OPTIONAL {
                    SELECT DISTINCT ?related ?datasetKey WHERE {
                      VALUES ?related {
                        {{#each localMatches}}
                          <{{this}}>
                        {{/each}}
                      }
                      ?related a ?type .
                      [[> partial:valuesDatasetLabels]]
                      FILTER(STRSTARTS(STR(?related), ?datasetPrefix))
                      BIND(?dataset AS ?datasetKey)
                    }
                  }
                  OPTIONAL {
                    GRAPH <http://schema.swissartresearch.net/rds/graph/labels> {
                      ?related rds:label ?label .
                    }
                  }
                  OPTIONAL {
                    SELECT ?related (?datasetLabel AS ?prefixLabel) WHERE {
                      VALUES ?related {
                        {{#each localMatches}}
                          <{{this}}>
                        {{/each}}
                      }
                      [[> partial:valuesDatasetLabels]]
                      FILTER(STRSTARTS(STR(?related), ?datasetPrefix))
                    }
                  }
                  BIND(REPLACE(STR(?related), "^https?://([^/?#]+).*$", "$1") AS ?external)
                  BIND(IRI(CONCAT("urn:rds:link-map:outside:", ENCODE_FOR_URI(COALESCE(?prefixLabel, ?external)))) AS ?groupNode)
                }
                GROUP BY ?related ?datasetKey ?external ?groupNode'
                template="{{> source-links}}"
                no-result-template=""
              >
                [[> sourceLinksTemplate]]
              </semantic-query>
            {{/if}}
          </div>
        {{/if}}
      </template>
    </mp-event-target-template-render>
  </div>
  <mp-event-target-template-render id="detail-panel-footer" template="{{> detail-panel-footer}}">
    <template id="detail-panel-footer">
      {{#if subjectUri}}
        <semantic-link class="detail-resource-link" iri="{{subjectUri}}" target="_blank">
          Open full record
        </semantic-link>
      {{/if}}
    </template>
  </mp-event-target-template-render>
</div>

[[#*inline "detailFieldsTemplate"]]
  <template id="detail-fields">
    {{#if bindings}}
      <div class="detail-panel-section">
        <div class="detail-section-title">Source data</div>
        {{#each bindings}}
          <div class="detail-row">
            <span class="detail-property">{{field.value}}</span>
            <mp-text-truncate 
              class="detail-value"
              lines=3 
              expand='<div class="detail-value-expand"> ...<a>show more</a></div>' 
              collapse='<div class="detail-value-collapse">(<a>show less</a>)</div>'
            >
              {{value.value}}
            </mp-text-truncate>
          </div>
        {{/each}}
      </div>
    {{/if}}
  </template>
[[/inline]]

[[#*inline "sourceLinksTemplate"]]
  <template id="source-links">
    {{#if bindings}}
      <div class="detail-panel-section detail-section--related">
        <div class="detail-section-title">Links from source record</div>
        <rds-item-truncate class="detail-related-list" limit="5">
          {{#each bindings}}
            <div class="detail-row detail-related-record" data-node="{{related.value}}" data-group-node="{{groupNode.value}}">
              <rds-copy-popover uri="{{related.value}}" rds-record="{{datasetKey.value}}">
                {{#if datasetKey.value}}
                  <button type="button" class="rds-badge" data-ds="{{datasetKey.value}}">
                    <rds-dataset-label key="{{datasetKey.value}}"></rds-dataset-label>
                  </button>
                {{else}}
                  <button type="button" class="rds-badge">{{external.value}}</button>
                {{/if}}
              </rds-copy-popover>
              <div class="detail-related-content">
                {{#if labels.value}}
                  <rds-item-truncate class="detail-related-label" limit="3">
                    {{#each (split labels.value "|||")}}
                      <span>{{this}}</span>
                    {{/each}}
                  </rds-item-truncate>
                {{/if}}
                <rds-copy-popover class="detail-related-uri" uri="{{related.value}}" rds-record="{{datasetKey.value}}">{{related.value}}</rds-copy-popover>
              </div>
            </div>
          {{/each}}
        </rds-item-truncate>
      </div>
    {{/if}}
  </template>
[[/inline]]
