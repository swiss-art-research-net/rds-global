<div id="rds-link-map-host" class="rds-link-map-host">
  <mp-event-target-template-render id="rds-link-map-paths" template="{{> groupLinkMapPaths}}">
    <template id="groupLinkMapPaths">
      {{#if bindings}}
        <div data-rds-graph-request="{{requestId}}">
          [[> partial:groupLinkMapGraph]]
        </div>
      {{/if}}
    </template>
  </mp-event-target-template-render>
</div>
<div class="rds-link-map-loading" role="status" aria-label="Loading connections" hidden>
  <div class="system-spinner"><i class="system-spinner__icon material-icons-round" aria-hidden="true">motion_photos_on</i></div>
</div>
<div class="rds-link-map-error" role="alert" hidden>
  <span></span>
  <button type="button" class="rds-link-map-retry">Retry</button>
</div>
<div hidden>
<mp-event-target-template-render id="rds-link-map-load" template="{{> groupLinkMapLoad}}">
  <template id="groupLinkMapLoad">
    {{#if requestId}}
<div data-rds-request="{{requestId}}">
<semantic-query
  query='SELECT ?candidate ?displayRows WHERE {
    BIND({{stringify (stringify rows)}} AS ?displayRows)
    OPTIONAL {
      SELECT DISTINCT ?candidate WHERE {
        VALUES ?candidate { {{#each rows}}{{#each (arraySplit matches.value)}} <{{this}}> {{/each}}{{/each}} }
        ?candidate a ?candidateType .
        FILTER(?candidate NOT IN ({{#each rows}} <{{subject.value}}>, {{/each}} <urn:rds:link-map:no-record>))
      }
    }
  }'
  template="{{> groupLinkMapCandidates}}"
>
  <template id="groupLinkMapCandidates">
    <semantic-query
      query='PREFIX os: <http://www.researchspace.com/resource/assets/Ontologies/opensearch#>
      SELECT DISTINCT ?subject ?nodeDataset ?localMatches ?displayIndex WHERE {
        {
          VALUES (?subject ?nodeDataset ?localMatches ?displayIndex) {
            {{#each (arraySplit bindings.0.displayRows.value)}}
              (<{{subject.value}}> "{{dataset.value}}" {{stringify localMatches.value}} {{@index}})
            {{/each}}
          }
        }
        {{#each bindings}}{{#if candidate}}
        UNION {
          SERVICE <http://platform:8080/sparql?repository=opensearch> {
            ?lookup os:searchTerm <{{candidate.value}}> ;
              os:hasSubject ?subject ;
              os:hasDataset ?nodeDataset ;
              os:hasLocalMatches ?localMatches .
          }
          FILTER(?subject = <{{candidate.value}}>)
        }
        {{/if}}{{/each}}
      }'
      template="{{> groupLinkMapEnriched}}"
    >
      <template id="groupLinkMapEnriched">
        <rds-link-map-paths hidden records="{{stringify bindings}}"></rds-link-map-paths>
      </template>
    </semantic-query>
  </template>
</semantic-query>

</div>
    {{/if}}
  </template>
</mp-event-target-template-render>

</div>
