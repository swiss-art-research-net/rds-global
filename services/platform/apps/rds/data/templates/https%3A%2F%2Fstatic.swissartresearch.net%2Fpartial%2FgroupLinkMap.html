<semantic-query
  query='SELECT ?subject ?nodeDataset ?localMatches ?displayIndex ?memberCount ?current WHERE {
    VALUES (?subject ?nodeDataset ?localMatches ?displayIndex) {
      {{#each rows}}
        (<{{subject.value}}> "{{dataset.value}}" {{stringify localMatches.value}} {{@index}})
      {{/each}}
    }
    BIND({{memberCount}} AS ?memberCount)
    BIND(<{{subjectUri}}> AS ?current)
  }'
  template="{{> groupLinkMapRecords}}"
>
  <template id="groupLinkMapRecords">
    [[> partial:groupLinkMapGraph]]
  </template>
</semantic-query>
