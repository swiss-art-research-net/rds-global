<semantic-data-table
  id='grid-result-table'
  query='SELECT DISTINCT ?prefLabel ?subject ?recordId ?description ?typeClass ?dataset ?reference ?score ?scoreDisplay ?isReference WHERE {
    BIND(REPLACE(STR(?subject), "^.*[/#]", "") AS ?recordId)
    BIND(ROUND(?score * 10) / 10 AS ?scoreDisplay)
    BIND(IF(?subject = ?reference, 1, 0) AS ?isReference)
  } GROUP BY ?subject ?recordId ?description ?prefLabel ?typeClass ?dataset ?reference ?score ?scoreDisplay ?isReference
  ORDER BY DESC(?score) DESC(?isReference) ?reference'
  number-of-displayed-rows="4"
  options='{
    "showFilter": false,
    "enableSort": false,
    "enableGrouping": true,
    "groupingOptions": {
      "groupedBy": ["reference"],
      "expandByDefault": true,
      "groupRowTemplate": "{{> groupRowTemplate}}",
      "groupMemberRowsTemplate": "{{> groupMemberRowsTemplate}}",
      "showGroupRowToggle": false,
      "toggleGroupRowOnClick": true
    }
  }'
  no-result-template="Nothing found"
  column-configuration='[
    {
      "variableName": "reference",
      "displayName": "ref",
      "visible": false
    },
    {
      "variableName": "scoreDisplay",
      "displayName": "Score"
    },
    {
      "variableName": "prefLabel",
      "displayName": "Reference Record"
    },
    {
      "variableName": "dataset",
      "displayName": "Datasets"
    },
    {
      "variableName": "typeClass",
      "displayName": "Type"
    },
    {
      "variableName": "description",
      "displayName": "Description"
    }
  ]'
>
  <template id="groupRowTemplate">
    <div class="group-row">
      <div class="group-row-score">{{rows.0.scoreDisplay.value}}</div>
      <div class="group-row-label">
        <div class="group-row-label-text">{{rows.0.prefLabel.value}}</div>
        <div class="group-row-reference-uri">
          <span>URI: </span>{{rows.0.subject.value}}
        </div>
      </div>
      <div class="group-row-datasets">
        {{#each rows}}
          <span class="rds-badge" data-ds="{{dataset.value}}">{{dataset.value}}</span>
        {{/each}}
      </div>
      <div class="group-row-type">{{rows.0.typeClass.value}}</div>
      <div class="group-row-description">{{rows.0.description.value}}</div>
      <button type="button" class="rs-row-toggle group-row-toggle{{#if isExpanded}} is-expanded{{/if}}" aria-label="Toggle grouped records">
        <span class="group-row-toggle-count">{{memberCount}}</span>
        <img class="group-row-toggle-chevron" src="/assets/no-auth/chevron.svg" alt="" />
      </button>
    </div>
  </template>

  <template id="groupMemberRowsTemplate">
    <div class="group-members">
      <div class="group-members-summary">
        <div class="group-members-count">{{memberCount}} equivalent records</div>
        <div class="group-members-label">{{rows.0.prefLabel.value}}</div>
      </div>
      <div class="group-members-list">
        {{#each rows}}
          <div class="single-row">
            <div class="single-row-dataset">
              <span class="rds-badge" data-ds="{{dataset.value}}">{{dataset.value}}</span>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">Label</div>
              <mp-event-trigger
                type="Component.TemplateUpdate"
                targets='["detail-panel"]'
                data='{"subjectUri": "{{subject.value}}", "prefLabel": "{{prefLabel.value}}", "dataset": "{{dataset.value}}"}'>
                <rds-record-select class="single-row-link">{{prefLabel.value}}</rds-record-select>
              </mp-event-trigger>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">URI</div>
              <div>{{subject.value}}</div>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">ID</div>
              <div>{{recordId.value}}</div>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">Source Type(s)</div>
              <semantic-query
                query='SELECT DISTINCT ?originalType WHERE {
                  BIND(<{{subject.value}}> AS ?subject)
                  BIND("{{dataset.value}}" AS ?dataset)

                  VALUES (?dataset ?sourceGraph) {
                    ("aat" <http://vocab.getty.edu/aat/graph>)
                    ("gnd" <https://d-nb.info/gnd/authorities/graph>)
                    ("geonames" <http://sws.geonames.org/graph>)
                    ("sikart" <http://recherche.sik-isea.ch/graph>)
                    ("ulan" <http://vocab.getty.edu/ulan/graph>)
                    ("wikidata" <http://www.wikidata.org/graph>)
                  }

                  GRAPH ?sourceGraph {
                    ?subject a ?originalType .
                  }
                }
                LIMIT 12'
                template="{{> originalTypesTemplate}}"
              >
                <template id="originalTypesTemplate">
                  {{#if bindings}}
                    <div class="single-row-type-list">
                      {{#each bindings}}
                        <span><mp-label iri="{{originalType.value}}"></mp-label>{{#unless @last}}, {{/unless}}</span>
                      {{/each}}
                    </div>
                  {{/if}}
                </template>
              </semantic-query>
            </div>
            <div class="single-row-field single-row-description">
              <div class="single-row-heading">Description</div>
              <div>{{description.value}}</div>
            </div>
          </div>
        {{/each}}
      </div>
    </div>
  </template>
</semantic-data-table>
