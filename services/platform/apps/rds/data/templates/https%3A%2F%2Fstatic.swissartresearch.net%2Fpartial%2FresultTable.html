<semantic-data-table
  id='grid-result-table'
  query='SELECT DISTINCT ?prefLabel ?subject ?recordId ?description ?typeClass ?dataset ?reference ?score ?scoreDisplay ?isReference ?matches ?types WHERE {
    BIND(REPLACE(STR(?subject), "^.*[/#]", "") AS ?recordId)
    BIND(ROUND(?score * 10) / 10 AS ?scoreDisplay)
    BIND(IF(?subject = ?reference, 1, 0) AS ?isReference)
  } GROUP BY ?subject ?recordId ?description ?prefLabel ?typeClass ?dataset ?reference ?score ?scoreDisplay ?isReference ?matches ?types
  ORDER BY DESC(?score) DESC(?isReference) ?reference'
  number-of-displayed-rows="4"
  options='{
    "showFilter": false,
    "enableSort": false,
    "enableGrouping": true,
    "groupingOptions": {
      "groupedBy": ["reference"],
      "expandByDefault": true,
      "groupRowTemplate": "{{> groupRowTemplate}}",
      "groupMemberRowsTemplate": "{{> groupMemberRowsTemplate}}",
      "showGroupRowToggle": false,
      "toggleGroupRowOnClick": false
    }
  }'
  no-result-template="Nothing found"
  column-configuration='[
    {
      "variableName": "reference",
      "displayName": "ref",
      "visible": false
    },
    {
      "variableName": "scoreDisplay",
      "displayName": "Score"
    },
    {
      "variableName": "prefLabel",
      "displayName": "Reference Record"
    },
    {
      "variableName": "dataset",
      "displayName": "Datasets"
    },
    {
      "variableName": "typeClass",
      "displayName": "Type"
    },
    {
      "variableName": "description",
      "displayName": "Description"
    }
  ]'
>
  <template id="groupRowTemplate">
    <div class="group-row">
      <div class="group-row-score">{{rows.0.scoreDisplay.value}}</div>
      <div class="group-row-label">
        <div class="group-row-label-text">{{rows.0.prefLabel.value}}</div>
        <div class="group-row-reference-uri">
          <span>URI: </span>
          <rds-copy-value value="{{rows.0.subject.value}}">
            {{rows.0.subject.value}}
          </rds-copy-value>
        </div>
      </div>
      <div class="group-row-datasets">
        {{#each rows}}
          <rds-copy-popover uri="{{subject.value}}" record-id="{{recordId.value}}">
            <button type="button" class="rds-badge" data-ds="{{dataset.value}}">
              <rds-dataset-label key="{{dataset.value}}"></rds-dataset-label>
            </button>
          </rds-copy-popover>
        {{/each}}
      </div>
      <div class="group-row-type">{{rows.0.typeClass.value}}</div>
      <div class="group-row-description">{{rows.0.description.value}}</div>
      <button type="button" class="rs-row-toggle group-row-toggle{{#if isExpanded}} is-expanded{{/if}}" aria-label="Toggle grouped records">
        <span class="group-row-toggle-count">{{memberCount}}</span>
        <img class="group-row-toggle-chevron" src="/assets/no-auth/chevron.svg" alt="" />
      </button>
    </div>
  </template>

  <template id="groupMemberRowsTemplate">
    <div class="group-members">
      <div class="group-members-summary">
        <div class="group-members-count">{{memberCount}} equivalent records</div>
        <div class="group-members-label">{{rows.0.prefLabel.value}}</div>
      </div>
      <div class="group-members-list">
        {{#each rows}}
          <div class="single-row">
            <div class="single-row-dataset">
              <rds-copy-popover uri="{{subject.value}}" record-id="{{recordId.value}}">
                <button type="button" class="rds-badge" data-ds="{{dataset.value}}">
                  <rds-dataset-label key="{{dataset.value}}"></rds-dataset-label>
                </button>
              </rds-copy-popover>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">Label</div>
              <mp-event-trigger
                type="Component.TemplateUpdate"
                targets='["detail-panel"]'
                data='{
                  "subjectUri": "{{subject.value}}", 
                  "recordId": "{{recordId.value}}",
                  "prefLabel": "{{prefLabel.value}}", 
                  "dataset": "{{dataset.value}}", 
                  "rdsType": "{{typeClass.value}}", 
                  "matches": [{{#each (arraySplit matches.value)}}"{{this}}"{{#unless @last}},{{/unless}}{{/each}}], 
                  "sourceTypes": [{{#each (arraySplit types.value)}}"{{this}}"{{#unless @last}},{{/unless}}{{/each}}]}'
              >
                <rds-record-select
                  class="single-row-link"
                  aria-label="Open details for {{prefLabel.value}}"
                >{{prefLabel.value}}
                </rds-record-select>
              </mp-event-trigger>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">URI</div>
              <div>
                <rds-copy-value value="{{subject.value}}">
                  {{subject.value}}
                </rds-copy-value>
              </div>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">ID</div>
              <div>{{recordId.value}}</div>
            </div>
            <div class="single-row-field">
              <div class="single-row-heading">Source Type(s)</div>
                {{#each (arraySplit types.value)}}
                  <span><mp-label iri="{{this}}"></mp-label>{{#unless @last}}, {{/unless}}</span>
                {{/each}}
            </div>
            <div class="single-row-field single-row-description">
              <div class="single-row-heading">Description</div>
              <div>{{description.value}}</div>
            </div>
            <div class="single-row-related">
              <semantic-query
                query='SELECT DISTINCT ?related ?dataset ?datasetLabel ?label WHERE {
                  VALUES (?related) {
                    {{#each (arraySplit matches.value)}}
                      (<{{this}}>)
                    {{/each}}
                  }

                  ?related a ?type .

                  [[> partial:valuesDatasetLabels]]

                  FILTER(STRSTARTS(STR(?related), ?datasetPrefix))
                  OPTIONAL { ?related rds:label ?label }
                }
                LIMIT 12'
                template="{{> relatedRecordsTemplate}}"
              >
                <template id="relatedRecordsTemplate">
                  {{#if bindings}}
                    <div class="related-records">
                      <div class="single-row-heading">Related records</div>
                      <rds-item-truncate class="related-records-list" limit="3">
                        {{#each bindings}}
                          <div class="related-record">
                            <rds-copy-popover uri="{{related.value}}">
                              <button type="button" class="rds-badge" data-ds="{{dataset.value}}">
                                <rds-dataset-label key="{{dataset.value}}"></rds-dataset-label>
                              </button>
                            </rds-copy-popover>
                            <span class="related-record-label">{{label.value}}</span>
                            <rds-copy-value class="related-record-uri" value="{{related.value}}">
                              {{related.value}}
                            </rds-copy-value>
                          </div>
                        {{/each}}
                      </rds-item-truncate>
                    </div>
                  {{/if}}
                </template>
              </semantic-query>
            </div>
          </div>
        {{/each}}
      </div>
    </div>
  </template>
</semantic-data-table>
