<semantic-data-table
  id='grid-result-table'
  query='SELECT DISTINCT ?prefLabel ?subject ?recordId ?description ?typeClass ?dataset ?reference ?score ?scoreDisplay ?isReference ?localMatches ?matches ?types WHERE {
    BIND(REPLACE(STR(?subject), "^.*[/#]", "") AS ?recordId)
    BIND(ROUND(?score * 10) / 10 AS ?scoreDisplay)
    BIND(IF(?subject = ?reference, 1, 0) AS ?isReference)
  } GROUP BY ?subject ?recordId ?description ?prefLabel ?typeClass ?dataset ?reference ?score ?scoreDisplay ?isReference ?localMatches ?matches ?types
  ORDER BY DESC(?score) DESC(?isReference) ?reference'
  number-of-displayed-rows="4"
  options='{
    "showFilter": false,
    "enableSort": false,
    "enableGrouping": true,
    "groupingOptions": {
      "groupedBy": ["reference"],
      "expandByDefault": true,
      "groupRowTemplate": "{{> groupRowTemplate}}",
      "groupMemberRowsTemplate": "{{> groupMemberRowsTemplate}}",
      "showGroupRowToggle": false,
      "toggleGroupRowOnClick": false
    }
  }'
  no-result-template="Nothing found"
  column-configuration='[
    {
      "variableName": "reference",
      "displayName": "ref",
      "visible": false
    },
    {
      "variableName": "scoreDisplay",
      "displayName": "Search score"
    },
    {
      "variableName": "prefLabel",
      "displayName": "RDS reference label"
    },
    {
      "variableName": "dataset",
      "displayName": "Datasets in group"
    },
    {
      "variableName": "typeClass",
      "displayName": "RDS type"
    },
    {
      "variableName": "memberCount",
      "displayName": "Group size"
    }
  ]'
>
  <template id="groupRowTemplate">
    <div class="group-row">
      <div class="group-row-score">{{rows.0.scoreDisplay.value}}</div>
      <div class="group-row-label">
        <div class="group-row-label-text">{{rows.0.prefLabel.value}}</div>
      </div>
      <div class="group-row-datasets">
        {{#each rows}}
          <rds-copy-popover uri="{{subject.value}}" record-id="{{recordId.value}}" rds-record="true">
            <button type="button" class="rds-badge" data-ds="{{dataset.value}}">
              <rds-dataset-label key="{{dataset.value}}"></rds-dataset-label>
            </button>
          </rds-copy-popover>
        {{/each}}
      </div>
      <div class="group-row-type"><div class="group-row-field-heading">RDS type</div>{{rows.0.typeClass.value}}</div>
      <button type="button" class="rs-row-toggle group-row-toggle{{#if isExpanded}} is-expanded{{/if}}" aria-label="Toggle grouped records">
        <span class="group-row-toggle-count">{{memberCount}}</span>
        <img class="group-row-toggle-chevron" src="/assets/no-auth/chevron.svg" alt="" />
      </button>
    </div>
  </template>

  <template id="groupMemberRowsTemplate">
    <div class="group-members">
      <div class="group-members-summary">
        <div class="group-members-count">{{#ifCond memberCount "==" 1}}1 record for{{else}}{{memberCount}} related records for{{/ifCond}}</div>
        <div class="group-members-label">{{rows.0.prefLabel.value}}</div>
      </div>
      <div class="group-members-list">
        <div class="group-members-header">
          <div>Dataset</div>
          <div>Label</div>
          <div>URI</div>
          <div>Source types</div>
          <div>Description</div>
        </div>
        {{#each rows}}
          <div class="single-row">
            <div class="single-row-record-heading">
            <div class="single-row-dataset">
              <rds-graph-hover uri="{{subject.value}}" hidden></rds-graph-hover>
              <rds-copy-popover uri="{{subject.value}}" record-id="{{recordId.value}}" rds-record="true">
                <button type="button" class="rds-badge" data-ds="{{dataset.value}}">
                  <rds-dataset-label key="{{dataset.value}}"></rds-dataset-label>
                </button>
              </rds-copy-popover>
            </div>
            <div class="single-row-field single-row-label">
              <div class="single-row-heading">Label</div>
              <mp-event-trigger
                type="Component.TemplateUpdate"
                targets='["detail-panel","detail-panel-header","detail-panel-content","detail-panel-footer"]'
                data='{
                  "subjectUri": {{stringify subject.value}},
                  "recordId": {{stringify recordId.value}},
                  "prefLabel": {{stringify prefLabel.value}},
                  "dataset": {{stringify dataset.value}},
                  "rdsType": {{stringify typeClass.value}},
                  "localMatches": [{{#each (arraySplit localMatches.value)}}{{stringify this}}{{#unless @last}},{{/unless}}{{/each}}],
                  "sourceTypes": [{{#each (arraySplit types.value)}}{{stringify this}}{{#unless @last}},{{/unless}}{{/each}}],
                  "memberCount": {{../memberCount}},
                  "rows": [{{#each ../rows}} {
                    "subject": { "value": {{stringify subject.value}} },
                    "prefLabel": { "value": {{stringify prefLabel.value}} },
                    "dataset": { "value": {{stringify dataset.value}} },
                    "localMatches": { "value": {{stringify localMatches.value}} },
                    "matches": { "value": {{stringify matches.value}} }
                  }{{#unless @last}},{{/unless}}{{/each}}]}'
              >
                <rds-record-select
                  class="single-row-link"
                  aria-label="Open details for {{prefLabel.value}}"
                >{{prefLabel.value}}
                </rds-record-select>
              </mp-event-trigger>
            </div>
            </div>
            <div class="single-row-field single-row-uri">
              <div class="single-row-heading">URI</div>
              <div>
                <rds-copy-popover uri="{{subject.value}}" record-id="{{recordId.value}}" rds-record="true">{{subject.value}}</rds-copy-popover>
              </div>
            </div>
            <div class="single-row-field single-row-types">
              <div class="single-row-heading">Source types</div>
                {{#each (arraySplit types.value)}}
                  <span><mp-label iri="{{this}}"></mp-label>{{#unless @last}}, {{/unless}}</span>
                {{/each}}
            </div>
            <div class="single-row-field single-row-description">
              <div class="single-row-heading">Description</div>
              <div>{{description.value}}</div>
            </div>
          </div>
        {{/each}}
      </div>
    </div>
  </template>
</semantic-data-table>
