# https://taskfile.dev

version: '3'

vars:
  DATASETS_CONFIG_YML: /config/datasets.yml
  DIRECTORY_INGEST_DATA: /data/ingest
  DIRECTORY_SOURCE_DATA: /data/source
  DIRECTORY_SAMEAS_STATEMENTS: /data/sameAsStatements/sources

env:
  QLEVER_ENDPOINT: http://qlever:7001
  WIKIDATA_ENDPOINT: https://qlever.dev/api/wikidata

includes:
  utilities:
    taskfile: ./taskfiles/utilities.yml
    flatten: true
tasks:

  default:
    desc: Run entire pipeline
    interactive: True
    cmds:
      - task: update-data-aat
      - task: update-data-geonames
      - task: update-data-gnd
      - task: update-data-sikart
      - task: update-data-thesarchesp
      - task: update-data-thesobjmob
      - task: update-data-ulan
      - task: prepare-metadata-for-indexing
      - task: index-data
      - task: generate-type-mappings
      - task: generate-labels
      - task: generate-sameas-statements
      - task: index-data # Re-index after data generation
      - task: add-data-to-search-index
      #- task: ingest-metadata
      #- task: ingest-sameas-statements
      #- task: materialise-num-sameas-statements

  add-data-to-search-index:
    desc: Add all data to OpenSearch index
    vars:
      DATASETS:
        sh: echo "$DATASETS"
    cmds:
      - for:
          var: DATASETS
          split: ','
          as: DATASET
        task: _add_to_search_index
        vars:
          DATASET: "{{.DATASET}}"

  fetch-all-sameas-statements:
    desc: Fetch data reuired for SameAs statements
    vars:
      DATASETS:
        sh: echo "$DATASETS"
    cmds: 
      - mkdir -p {{.DIRECTORY_SAMEAS_STATEMENTS}}
      - for:
          var: DATASETS
          split: ','
          as: DATASET
        task: fetch-sameas-statements-for-dataset
        vars:
          DATASET: "{{.DATASET}}"    
      - for:
          var: DATASETS
          split: ','
          as: DATASET
        task: fetch-sameas-statements-for-dataset-from-wikidata
        vars:
          DATASET: "{{.DATASET}}"

  fetch-sameas-statements-for-dataset:
    desc: Fetch SameAs statements for a specified dataset passed as DATASET variable or via CLI argument
    vars:
      DATASET:
        sh: |
          if [ -z "{{.DATASET}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            echo "{{.DATASET}}"
          fi
    cmds:
      - task: _fetch-sameas-statements-for-dataset
        vars:
          DATASET: "{{.DATASET}}"

  fetch-sameas-statements-for-dataset-from-wikidata:
    desc: Fetch SameAs statements from Wikidata for a specified dataset passed as DATASET variable or via CLI argument
    vars:
      DATASET:
        sh: |
          if [ -z "{{.DATASET}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            echo "{{.DATASET}}"
          fi
    cmds:
      - python /pipeline/scripts/fetchMatchesFromWikidata.py --endpoint "{{.QLEVER_ENDPOINT}}" --wikidata-endpoint "{{.WIKIDATA_ENDPOINT}}" --output-directory /data/sameAsStatements/sources --config "{{.DATASETS_CONFIG_YML}}" --dataset "{{.DATASET}}"

  generate-sameas-statements:
    desc: Generates SameAs statements between entities
    vars:
      DATA_DIRECTORY: /data/sameAsStatements/combinedSameAs
      FILE_FORMAT: ttl
      GRAPH: http://schema.swissartresearch.net/rds/exact-match-statements
    cmds:
      - task: fetch-all-sameas-statements
      - mkdir -p {{.DATA_DIRECTORY}}
      - task: process-sameas-statements
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"
  
  generate-type-mappings:
    desc: Generate type mappings for RDS entities
    vars:
      DATASETS:
        sh: echo "$DATASETS"
      OUTPUT_DIRECTORY: /data/ingest/type-mappings
    cmds:
      - mkdir -p "{{.OUTPUT_DIRECTORY}}"
      - for:
          var: DATASETS
          split: ','
          as: DATASET
        cmd: python /pipeline/scripts/generateTypeMappings.py --endpoint "{{.QLEVER_ENDPOINT}}" --config "{{.DATASETS_CONFIG_YML}}" --dataset "{{.DATASET}}" --output-directory "{{.OUTPUT_DIRECTORY}}" {{.CLI_ARGS}}

  generate-labels:
    desc: Generate labels for URIs
    vars:
      DATASETS:
        sh: echo "$DATASETS"
      OUTPUT_DIRECTORY: /data/ingest/labels
    cmds:
      - mkdir -p {{.OUTPUT_DIRECTORY}}
      - for:
          var: DATASETS
          split: ','
          as: DATASET
        cmd: python /pipeline/scripts/generateLabels.py --endpoint "{{.QLEVER_ENDPOINT}}" --config "{{.DATASETS_CONFIG_YML}}" --dataset "{{.DATASET}}" --output-directory "{{.OUTPUT_DIRECTORY}}" {{.CLI_ARGS}}

  ingest-data-from-folder:
    desc: Ingest data to QLever from a specified folder. The folder should be passed via CLI argument
    vars:
      DIRECTORY:
        sh: echo "{{.CLI_ARGS}}"
    cmds:
      - |
        if [ -z "{{.DIRECTORY}}" ]; then
          echo "Error: No directory specified. Please provide a directory as a CLI argument."
          exit 1
        fi
      - task: _ingest-data-from-folder
        vars:
          DIRECTORY: "{{.DIRECTORY}}"

  index-data:
    desc: Index all data in QLever
    cmds:
      - task: _build_qlever_index
        vars:
          INPUT_DIR: /data/ingest
          NAME: rds
    
  prepare-metadata-for-indexing:
    desc: Prepare RDS metadata for indexing
    sources:
      - /data/rds-metadata/_datasetsMetadata.ttl
      - /data/rds-metadata/rds-ontologies-description.ttl
      - /data/rds-metadata/type-mapping.ttl
    cmds:
      - task: _prepareFileForIndexing
        vars: 
          FILE: /data/source/rds-metadata/_datasetsMetadata.ttl
          FILE_FORMAT: ttl
          GRAPH: http://rds.swissartresearch.net/graph/datasetMetadata
      - task: _prepareFileForIndexing
        vars:
          FILE_FORMAT: ttl
          FILE: /data/source/rds-metadata/rds-ontologies-description.ttl
          GRAPH: http://rds.swissartresearch.net/graph/rdsOntologies
      - task: _prepareFileForIndexing
        vars:
          FILE_FORMAT: ttl
          FILE: /data/source/rds-metadata/type-mapping.ttl
          GRAPH: http://schema.swissartresearch.net/rds/typeMapping

  ingest-sameas-statements:
    desc: Ingest SameAs statements
    sources:
      - /data/sameAsStatements/combined/*.ttl
    cmds:
      - task: _ingest-data-from-file
        vars:
          NAME: Type Mappings
          FILE: /data/sameAsStatements/combined/*.ttl
          GRAPH: http://schema.swissartresearch.net/rds/exact-match-statements
   
  materialise-num-sameas-statements:
    desc: Materialise the count of SameAs statements per entity
    sources:
      - /data/sameAsStatements/combined/*.ttl
    vars:
      GRAPH: http://schema.swissartresearch.net/rds/exact-match-statements
    cmds:
      - mkdir -p /pipeline/tmp/requests
      - |
        echo "PREFIX rds: <http://schema.swissartresearch.net/ontology/rds#>
              INSERT {
                GRAPH <{{.GRAPH}}>
                {
                  ?subject <http://schema.swissartresearch.net/rds/numSameAsStatements> ?numSameAs .
                }
              } WHERE {
                ?subject rds:related ?sameAs .
                {
                  SELECT (COUNT(?sameAs) as ?numSameAs) ?subject WHERE {
                    ?subject rds:related ?sameAs .
                  } GROUP BY ?subject
                }
              }" > /pipeline/tmp/requests/materialise_num_sameas.rq
      - $BLAZEGRAPH_RUNNER update --journal=$BLAZEGRAPH_JOURNAL /pipeline/tmp/requests/materialise_num_sameas.rq
  
  process-sameas-statements:
    desc: Process SameAs statements
    sources:
      - /data/sameAsStatements/*.ttl
    cmds:
      - mkdir -p /data/sameAsStatements/combined
      - cd /pipeline/scripts/sameAsProcessing; npm run start

  update-data-aat:
    desc: Update data for Getty AAT
    vars:
      GRAPH: http://vocab.getty.edu/aat/graph
      DATA_DIRECTORY: "{{.DIRECTORY_SOURCE_DATA}}/aat-data"
      DATA_URL: http://aatdownloads.getty.edu/VocabData/explicit.zip
      GUNZIP: false
      FILE_FORMAT: nt
    cmds:
      - task: _downloadAndUnzip
        vars:
          URL: "{{.DATA_URL}}"
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          GUNZIP: "{{.GUNZIP}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"

  update-data-geonames:
    desc: Update data for GeoNames
    vars:
      GRAPH: http://sws.geonames.org/graph
      DATA_DIRECTORY: "{{.DIRECTORY_SOURCE_DATA}}/geonames-data"
      DATA_URL: http://download.geonames.org/all-geonames-rdf.zip
      GUNZIP: false
      FILE_FORMAT: nt
    cmds:
      - task: _downloadAndUnzip
        vars:
          URL: "{{.DATA_URL}}"
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          GUNZIP: "{{.GUNZIP}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
      - echo "Preparing Geonames Data"
      - |
        if [ ! -f "{{.DATA_DIRECTORY}}/geonames.nt" ]; then
          cp /pipeline/scripts/convert2ntriples.py {{.DATA_DIRECTORY}}/convert2ntriples.py; cd {{.DATA_DIRECTORY}}; python convert2ntriples.py; rm convert2ntriples.py; cd -
        else
          echo "Geonames data already exists. Skipping conversion."
        fi
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"
  
  update-data-gnd:
    desc: Update data for GND
    vars:
      GRAPH: https://d-nb.info/gnd/authorities/graph
      DATA_DIRECTORY: "{{.DIRECTORY_SOURCE_DATA}}/gnd-authorities-data"
      DATA_URL: https://data.dnb.de/opendata/authorities-gnd_lds.nt.gz
      ONTOLOGY_URL: https://raw.githubusercontent.com/deutsche-nationalbibliothek/gnd-ontology/refs/heads/main/source/gnd.ttl
      GUNZIP: true
      FILE_FORMAT: nt
    cmds:
      - task: _downloadAndUnzip
        vars:
          URL: "{{.DATA_URL}}"
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          GUNZIP: "{{.GUNZIP}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
      - curl -o "{{.DATA_DIRECTORY}}/gnd-ontology.ttl" "{{.ONTOLOGY_URL}}"
      - rapper -i turtle -o ntriples "{{.DATA_DIRECTORY}}/gnd-ontology.ttl" > "{{.DATA_DIRECTORY}}/gnd-ontology.nt"
      - rm "{{.DATA_DIRECTORY}}/gnd-ontology.ttl"
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"

  update-data-sikart:
    desc: Update data for SIKART
    vars:
      GRAPH: http://recherche.sik-isea.ch/graph
      DATA_DIRECTORY: "{{.DIRECTORY_SOURCE_DATA}}/sikart-data"
      DATA_GIT_REPOSITORY: swiss-art-research-net/sikart-data
      DATA_GIT_PATH: source/SIK_20210616_2300.ttl.zip
      GUNZIP: false
      FILE_FORMAT: ttl
    cmds:
      - task: _downloadFromGitHubAndUnzip
        vars:
          GRAPH: "{{.GRAPH}}"
          DATA_DIRECTORY: "{{.DATA_DIRECTORY}}"
          DATA_GIT_REPOSITORY: "{{.DATA_GIT_REPOSITORY}}"
          DATA_GIT_PATH: "{{.DATA_GIT_PATH}}"
          GUNZIP: "{{.GUNZIP}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          FILE_NAME: "data"
          GITHUB_USERNAME: $GITHUB_USERNAME_SIKART
          GITHUB_TOKEN: $GITHUB_TOKEN_SIKART
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"

  update-data-thesarchesp:
    desc: Update data for Thesaurus Architecture/Espace 
    vars:
      GRAPH: http://data.culture.fr/thesaurus/resource/ark:/67717/T96/graph
      DATA_DIRECTORY: "{{.DIRECTORY_SOURCE_DATA}}/thes-arch-esp-data"
      DATA_URL: http://data.culture.fr/thesaurus/data/ark:/67717/T96?includeSchemes=true&format=TURTLE
      GUNZIP: false
      FILE_FORMAT: ttl
    cmds:
      - task: _downloadFile
        vars:
          URL: "{{.DATA_URL}}"
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"

  update-data-thesobjmob:
    desc: Update data for Thesaurus Object/Mobiliers
    vars:
      GRAPH: http://data.culture.fr/thesaurus/resource/ark:/67717/T69/graph
      DATA_DIRECTORY: "{{.DIRECTORY_SOURCE_DATA}}/thes-obj-mob-data"
      DATA_URL: http://data.culture.fr/thesaurus/data/ark:/67717/T69?includeSchemes=true&format=TURTLE
      FILE_FORMAT: ttl
    cmds:
      - task: _downloadFile
        vars:
          URL: "{{.DATA_URL}}"
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"

  update-data-ulan:
    desc: Update data for Getty ULAN
    vars:
      GRAPH: http://vocab.getty.edu/ulan/graph
      DATA_DIRECTORY: "{{.DIRECTORY_SOURCE_DATA}}/ulan-data"
      DATA_URL: http://ulandownloads.getty.edu/VocabData/full.zip
      GUNZIP: false
      FILE_FORMAT: nt
    cmds:
      - task: _downloadAndUnzip
        vars:
          URL: "{{.DATA_URL}}"
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          GUNZIP: "{{.GUNZIP}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
      - task: _prepareForIndexing
        vars:
          DIRECTORY: "{{.DATA_DIRECTORY}}"
          FILE_FORMAT: "{{.FILE_FORMAT}}"
          GRAPH: "{{.GRAPH}}"

  verify-data:
    desc: Verify the validity of the source data or any data in a specified directory passed as CLI argument
    vars:
      DATA_DIRECTORY:
        sh: '[ -d "{{.CLI_ARGS}}" ] && echo "{{.CLI_ARGS}}" || echo "/data"'
    cmds:
      - |
        DATA_DIR="{{.DATA_DIRECTORY}}"
        FILES_VERIFIED=0
        FILES_OK=0
        FILES_ERROR=0
        ERROR_REPORT=""

        for file in $(find "$DATA_DIR" -type f -regex ".*\.\(ttl\|rdf\|rdfs\|nt\|nq\)"); do
          echo "Verifying $file,..."

          if out=$(rapper -g -c "$file" 2>&1); then
            triples=$(printf "%s\n" "$out" | awk '/Parsing returned/ {print $4}')
            echo "OK! Returned ${triples} triples"
            FILES_OK=$((FILES_OK + 1))
          else
            echo "VERIFICATION FAILED"
            err_line=$(printf "%s\n" "$out" | grep -i 'Error' | head -n1 || true)
            [ -z "$err_line" ] && err_line=$(printf "%s\n" "$out" | head -n1)
            echo "Error: $err_line"
            FILES_ERROR=$((FILES_ERROR + 1))
            ERROR_REPORT="${ERROR_REPORT}\n${file}: ${err_line}"
          fi
        done

        FILES_VERIFIED=$((FILES_OK + FILES_ERROR))

        echo
        echo "Verification completed."
        echo "Files verified: $FILES_VERIFIED"
        echo "Files OK: $FILES_OK"
        echo "Files with errors: $FILES_ERROR"

        if [ "$FILES_ERROR" -gt 0 ]; then
          echo
          echo "Error Report:"
          printf "%b\n" "${ERROR_REPORT#\\n}"
        fi

        if [ "$FILES_ERROR" -gt 0 ]; then
          exit 1
        fi