# https://taskfile.dev

version: '3'

tasks:

  _build_qlever_index:
    desc: Build QLever index for given data
    requires:
      vars: [NAME, INPUT_DIR, GRAPH]
    cmds:
      - echo "Building QLever index for {{.NAME}} from data in {{.INPUT_DIR}} with graph {{.GRAPH}}"
      - mkdir -p /index/{{.NAME}}
      - cd /index/{{.NAME}} && find /data/ingest/{{.INPUT_DIR}} -type f -name "*.nq" -exec sh -c 'cat "{}"' \; | IndexBuilderMain --index-basename {{.NAME}} --vocabulary-type on-disk-uncompressed -F nq -f - --text-words-from-literals | tee {{.Name}}.index-log.txt
    
  _downloadFile:
    internal: True
    interactive: True
    desc: Download data
    requires:
      vars: [URL, DIRECTORY, FILE_FORMAT]
    cmds:
      - if [ -d "{{.DIRECTORY }}" ]; then
          read -p "Do you want to remove previous data from {{.DIRECTORY}} and download new ones? (y/n) " REPLY;
          echo;
          if [[ $REPLY =~ ^[Yy]$ ]]; then
            rm -r -d "{{.DIRECTORY}}";
          fi;
        fi
        
        if [ ! -d "{{.DIRECTORY }}" ]; then
          mkdir -p "{{.DIRECTORY}}";
          cd "{{.DIRECTORY}}";
          echo "Fetching datasources...";
          curl -k "{{.URL}}" -o data.{{.FILE_FORMAT}};
          echo "Fetching completed.";
        fi

  _downloadAndUnzip:
    internal: True
    interactive: True
    desc: Download and unzip data
    requires:
      vars: [URL, DIRECTORY, GUNZIP, FILE_FORMAT]
    cmds:
      - # If the directory already exists, ask the user if they want to delete it
      - |
        bash -lc '
        SKIP_ALL=false
        if [ -d "{{.DIRECTORY}}" ]; then
          read -t 10 -p "Do you want to remove previous data from {{.DIRECTORY}} and download new ones? (Y/n) (defaults to Y after 10s)" REPLY
          [ -z "$REPLY" ] && REPLY="Y"
          echo
          if [[ $REPLY =~ ^[Yy]$ ]]; then
            rm -r -d "{{.DIRECTORY}}"
          else
            SKIP_ALL=true
          fi
        fi
        if [ ! -d "{{.DIRECTORY }}" ] && [ $SKIP_ALL != true ]; then
          mkdir -p "{{.DIRECTORY}}"
          cd "{{.DIRECTORY}}"
          echo "Fetching datasources..."
          if [ "{{.GUNZIP}}" == true ]; then
            curl -k "{{.URL}}" -o data.{{.FILE_FORMAT}}.gz
          else
            curl -k "{{.URL}}" -o data.zip
          fi
          echo "Fetching completed."
        fi
        if [ "{{.SKIP_UNZIPPING}}" != true ] && [ $SKIP_ALL != true ]; then
            echo "Unzip datasources..."
            cd "{{.DIRECTORY}}"
            if [ "{{.GUNZIP}}" == true ]; then
              gunzip data.{{.FILE_FORMAT}}.gz
            elif [ -f "data.zip" ]; then
                unzip data.zip
            fi
            echo "Unzipping completed."
        fi'

  _downloadFromGitHubAndUnzip:
    internal: True
    interactive: True
    desc: Download and unzip data from GitHub
    cmds:
      - |
        if [ -d "{{.DATA_DIRECTORY }}" ]; then
          read -p "Do you want to remove previous data from {{.DATA_DIRECTORY}} and download new ones? (y/n) " REPLY
          echo
          if [[ $REPLY =~ ^[Yy]$ ]]; then
            rm -r -d "{{.DIRECTORY}}"
          else
            SKIP_ALL=true
          fi
        fi
        if [ ! -d "{{.DIRECTORY }}" ] && [ $SKIP_ALL != true ]; then
          mkdir -p "{{.DATA_DIRECTORY}}"
          python /pipeline/scripts/getFileContentsFromGit.py --username "{{.GITHUB_USERNAME}}" --token "{{.GITHUB_TOKEN}}" --repo "{{.DATA_GIT_REPOSITORY}}" --path "{{.DATA_GIT_PATH}}" --localfile "{{.DATA_DIRECTORY}}/{{.FILE_NAME}}.zip"
          unzip "{{.DATA_DIRECTORY}}/{{.FILE_NAME}}.zip" -d "{{.DATA_DIRECTORY}}"
        fi

  _fetch-sameas-statements-local:
    desc: Fetch SameAs Statements for different datasets
    internal: True
    status:
      - test -f "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
    vars:
      QUERY_FILE: /pipeline/tmp/sameas{{.DATASET}}.rq
    cmds:
      - echo "Fetching SameAs Statements for {{.DATASET}}"
      - echo "{{.QUERY}}" > "{{.QUERY_FILE}}"
      - $BLAZEGRAPH_RUNNER construct --journal=$BLAZEGRAPH_JOURNAL --outformat=turtle "{{.QUERY_FILE}}" "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
      - rm "{{.QUERY_FILE}}"

  _fetch-sameas-statements-remote:
    desc: Fetch SameAs Statements for different datasets from an external SPARQL endpoint
    internal: True
    vars:
      NUM_DOWNLOAD_ATTEMPTS: 5
      CONNECTION_TIMEOUT: 10
      MAX_TIME: 1200
    status:
      - test -f "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
    cmds:
      - rm -f "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
      - |
        for ((i=1; i<={{.NUM_DOWNLOAD_ATTEMPTS}}; i++)) do
          if [[ ! -f "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}" ]]; then
            echo "Fetching SameAs Statements for {{.DATASET}} (Attempt $i of {{.NUM_DOWNLOAD_ATTEMPTS}})"
            curl -s -X POST -H "Accept: text/turtle" --data-urlencode "query={{.QUERY}}" --max-time {{.MAX_TIME}} --connect-timeout {{.CONNECTION_TIMEOUT}} "{{.ENDPOINT}}" > "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
          fi
        done

  _fetch-sameas-statements-remote-chunked:
    desc: Fetch SameAs Statements for different datasets from an external SPARQL endpoint
    internal: True
    vars:
      MAX_RESULTS_PER_REQUEST: 200000
      NUM_DOWNLOAD_ATTEMPTS: 5
      CONNECTION_TIMEOUT: 10
      MAX_TIME: 1200
    status:
      - test -f "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
    cmds:
      - rm -f "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
      - |
        for ((n=0; n<="{{.NUM_CHUNKS}}"; n++)) do
          OFFSET=$((n * {{.MAX_RESULTS_PER_REQUEST}}))
          if (( n==0 )); then
            OFFSET_STR=""
          else
            OFFSET_STR="OFFSET $OFFSET"
          fi
          echo "Fetching SameAs Statements for {{.DATASET}} (Chunk $n of {{.NUM_CHUNKS}})"
          OUTPUT_FILE_CHUNK="{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}.$n.chunk"
          for ((i=0; i<{{.NUM_DOWNLOAD_ATTEMPTS}}; i++)) do
            if [[ ! -f $OUTPUT_FILE_CHUNK ]]; then
              LIMIT_STATEMENT="LIMIT {{.MAX_RESULTS_PER_REQUEST}} $OFFSET_STR"
              curl -s -X POST -H "Accept: text/turtle" --data-urlencode "query={{.QUERY}}" --max-time {{.MAX_TIME}} --connect-timeout {{.CONNECTION_TIMEOUT}} "{{.ENDPOINT}}" > $OUTPUT_FILE_CHUNK
            fi
          done
        done
      - # Combine all the chunks into a single file
      - cat {{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}.*.chunk > "{{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}"
      - rm {{.DIRECTORY_SAMEAS_STATEMENTS}}/{{.OUTPUT_FILE}}.*.chunk

  _ingest-data-from-file:
    desc: Ingest data from file
    internal: True
    requires:
      vars: [NAME, FILE, GRAPH]
    cmds:
      - $BLAZEGRAPH_RUNNER load --journal=$BLAZEGRAPH_JOURNAL --graph={{.GRAPH}} {{.FILE}}

  _prepareForIndexing:
    desc: Prepare data for ingestion
    internal: True
    requires:
      vars: [DIRECTORY, FILE_FORMAT, GRAPH]
    vars:
      DIRECTORY_FOR_INGEST:
        sh: echo "{{.DIRECTORY_INGEST_DATA}}/$(basename {{.DIRECTORY}})_ingest"
      FILE_TYPE:
        sh: |
            case "{{.FILE_FORMAT}}" in
              rdf|owl)    echo rdfxml ;;
              nt)         echo ntriples ;;
              ttl)        echo turtle ;;
              trig)       echo trig ;;
              nq)         echo nquads ;;
              json|rj)    echo json ;;
              html|xhtml) echo rdfa ;;
              xml)        echo grddl ;;
              rss)        echo rss-tag-soup ;;
              *)          echo guess ;;
            esac
      LINE_LIMIT_FOR_SPLIT: 1000000
    cmds:
      - # Remove temporary directory if it exists
      - rm -rf "{{.DIRECTORY_FOR_INGEST}}"
      - # Create temporary directory
      - mkdir -p "{{.DIRECTORY_FOR_INGEST}}"
      - # use rapper to convert input files to nt format if necessary. If already in nt format, copy files to ingest directory
      - |
        if [ "{{.FILE_FORMAT}}" != "nt" ]; then
          echo "Converting files in {{.DIRECTORY}} to N-Triples format for ingestion..."
          for file in {{.DIRECTORY}}/*.{{.FILE_FORMAT}}; do
            [ -f "$file" ] || continue
            base_filename=$(basename "$file")
            output_file="{{.DIRECTORY_FOR_INGEST}}/${base_filename%.*}.nt"
            rapper -i "{{.FILE_TYPE}}" -o ntriples "$file" > "$output_file"
          done
        else
          echo "Copying N-Triples files from {{.DIRECTORY}} to ingestion directory..."
          cp {{.DIRECTORY}}/*.nt "{{.DIRECTORY_FOR_INGEST}}/"
        fi
      - # Add the named graph to each triple in the nt files
      - |
        echo "Adding named graph {{.GRAPH}} to each triple for ingestion..."
        for file in {{.DIRECTORY_FOR_INGEST}}/*.nt; do
          [ -f "$file" ] || continue
          nquad_file="${file%.nt}.nq"
          # Insert the graph name before the final dot at the end of each triple
          awk -v graph="<{{.GRAPH}}>" '{sub(/[ \t]*\.$/, " " graph " ."); print}' "$file" > "$nquad_file"     
          rm "$file"
        done
      - # Split large files into smaller chunks of 100000 lines each
      - |
        echo "Splitting large files into smaller chunks for ingestion..."
        for file in {{.DIRECTORY_FOR_INGEST}}/*.nq; do
          [ -f "$file" ] || continue
          line_count=$(wc -l < "$file")
          if [ "$line_count" -gt {{.LINE_LIMIT_FOR_SPLIT}} ]; then
            echo "Splitting $file (contains $line_count triples)..."
            split -l {{.LINE_LIMIT_FOR_SPLIT}} -d --additional-suffix=.nq "$file" "${file%.*}_part_"
            rm "$file"
          fi
        done

  _removeGraphFromTripleStore:
    desc: Remove graph from triple store
    internal: True
    requires:
      vars: [GRAPH]
    cmds:
      - echo "Removing graph {{.GRAPH}} from triple store"
      - curl -X POST --data-urlencode "update=DROP GRAPH <{{.GRAPH}}>" "{{.QLEVER_ENDPOINT}}" --data-urlencode "access-token={{.QLEVER_ACCESS_TOKEN}}"