services:

  endpoints:
    container_name: ${COMPOSE_PROJECT_NAME}-endpoints
    build: ./services/endpoints
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 200k
    ports:
      - ${PORT_ENDPOINTS}:80
    volumes:
      - ./config:/config:ro
  jobs:
    container_name: ${COMPOSE_PROJECT_NAME}-jobs
    build: ./services/jobs
    environment:
      GITHUB_USERNAME_SIKART: ${GITHUB_USERNAME_SIKART}
      GITHUB_TOKEN_SIKART: ${GITHUB_TOKEN_SIKART}
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN}
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 200k
    volumes:
      - ./binds/qlever-index:/index:rw
      - ./services/jobs/pipeline:/pipeline
      - ./data:/data

  platform:
    container_name: ${COMPOSE_PROJECT_NAME}-platform
    environment:
      PLATFORM_OPTS: >-
        -Dlog4j.configurationFile=classpath:org/researchspace/logging/log4j2.xml
        ${RESEARCHSPACE_OPTS:-}
      JAVA_OPTS: -Xmx1g
    image: swissartresearx/researchspace:7fa27dd39c4a02d3cf39b02f50162faed3eab8dd
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 200k
    ports:
      - ${PORT_RDS}:8080
    volumes:
     - ${DIRECTORY_PLATFORM_RUNTIME}:/runtime-data:rw
     - ./services/platform/apps:/apps

  qlever-datasets:
    container_name: ${COMPOSE_PROJECT_NAME}-qlever-datasets
    build: ./services/qlever-datasets
    entrypoint: ["sh", "-c", "./startServices.sh & tail -f /dev/null"]
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 200k
    working_dir: /scripts
    volumes:
      - ./binds/qlever-index:/index:rw
      - ./data/ingest:/index/data
      - ./services/qlever-datasets/scripts:/scripts
      - ./config:/config:ro

  qlever-rds:
    container_name: ${COMPOSE_PROJECT_NAME}-qlever-rds
    build: ./services/qlever-rds
    entrypoint: ["sh", "-c", "qlever start & tail -f /dev/null"]
    logging:
      driver: json-file
      options:
        max-file: '10'
        max-size: 200k
    ports:
      - ${PORT_QLEVER_RDS}:7001
    volumes:
      - ./binds/qlever-rds:/index:rw
      - ./data/source/rds-metadata:/index/data
      - ./services/qlever-rds/Qleverfile:/index/Qleverfile:ro