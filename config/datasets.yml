datasets:

  aat:
    graph: http://vocab.getty.edu/aat/graph
    namespace: http://vocab.getty.edu/aat/
    prefixes:
      gvp: http://vocab.getty.edu/ontology#
      skos: http://www.w3.org/2004/02/skos/core#
      xl: http://www.w3.org/2008/05/skos-xl#
    types:
      Type:
        - gvp:Concept
    queries:
      description: |
        ?subject gvp:parentStringAbbrev ?value .
      prefLabel: |
        ?subject gvp:prefLabelGVP/xl:literalForm ?value .
      labels: |
        ?subject (gvp:prefLabelGVP | xl:prefLabel | xl:altLabel)/xl:literalForm ?value .
      matches: |
        ?subject (skos:exactMatch | skos:closeMatch) ?value .
    wikidata_match_property: P1014

  geonames:
    graph: http://sws.geonames.org/graph
    namespace: https://sws.geonames.org/
    prefixes:
      gn: http://www.geonames.org/ontology#
      owl: http://www.w3.org/2002/07/owl#
    types:
      Place:
        - gn:Feature
    queries:
      description: |
        BIND("" AS ?value) .
      prefLabel: |
        ?subject gn:name ?value .
      labels: |
        ?subject gn:alternateName ?value .
      matches: |
        ?subject owl:sameAs ?value .
    wikidata_match_property: P1566

  gnd:
    graph: https://d-nb.info/gnd/authorities/graph
    prefixes:
      gnd: https://d-nb.info/standards/elementset/gnd#
      rdfs: http://www.w3.org/2000/01/rdf-schema#
      schema: http://schema.org/
      skos: http://www.w3.org/2004/02/skos/core#
    types:
      BibliographicItem:
        - gnd:Work
      BuiltWork:
        - gnd:BuildingOrMemorial
      Event:
        - gnd:ConferenceOrEvent
        - gnd:HistoricSingleEventOrEra
        - gnd:ProjectOrProgram
        - gnd:SeriesOfConferenceOrEvent
      Group:
        - gnd:AdministrativeUnit
        - gnd:Company
        - gnd:CorporateBody
        - gnd:FictiveCorporateBody
        - gnd:OrganOfCorporateBody
        - gnd:MusicalCorporateBody
        - gnd:ReligiousAdministrativeUnit
        - gnd:ReligiousCorporateBody
        - gnd:TerritorialCorporateBodyOrAdministrativeUnit
      Person:
        - gnd:DifferentiatedPerson
        - gnd:Person
        - gnd:UndifferentiatedPerson
      Place:
        - gnd:Country
        - gnd:ExtraterrestrialTerritory
        - gnd:FictivePlace
        - gnd:MemberState
        - gnd:NameOfSmallGeographicUnitLyingWithinAnotherGeographicUnit
        - gnd:NaturalGeographicUnit
        - gnd:PlaceOrGeographicName
        - gnd:ReligiousTerritory
        - gnd:WayBorderOrLine
        - gnd:TerritorialCorporateBodyOrAdministrativeUnit
      Type:
        - gnd:CharactersOrMorphemes
        - gnd:EthnographicName
        - gnd:Language
        - gnd:NomenclatureInBiologyOrChemistry
        - gnd:ProductNameOrBrandName
        - gnd:ProvenanceCharacteristic
        - gnd:Relationship
        - gnd:SoftwareProduct
        - gnd:SubjectHeading
        - gnd:SubjectHeadingSensoStricto
    queries:
      description: |
        ?subject ?predicateDescription ?value .
        VALUES (?predicateDescription) {
            ( <https://d-nb.info/standards/elementset/gnd#definition> )
            ( <https://d-nb.info/standards/elementset/gnd#note> )
            ( <https://d-nb.info/standards/elementset/gnd#historyOfTheCorporateBody> )
            ( <https://d-nb.info/standards/elementset/gnd#biographicalOrHistoricalInformation> )
            ( <https://d-nb.info/standards/elementset/gnd#professionOrOccupationAsLiteral> )
        }
      prefLabel: |
        ?subject ?predicatePrefLabel ?value .
        VALUES (?predicatePrefLabel) {
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheConferenceOrEvent> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheCorporateBody> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheFamily> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForThePerson> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForThePlaceOrGeographicName> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheSubjectHeading> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheWork> )
        }
      labels: |
        ?subject ?predicateLabel ?value .
        VALUES (?predicateLabel) {
            ( <https://d-nb.info/standards/elementset/gnd#forename> )
            ( <https://d-nb.info/standards/elementset/gnd#gndIdentifier> )
            ( <https://d-nb.info/standards/elementset/gnd#nameAddition> )
            ( <https://d-nb.info/standards/elementset/gnd#originalScriptNameOfThePerson> )
            ( <https://d-nb.info/standards/elementset/gnd#personalName> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheConferenceOrEvent> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheCorporateBody> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheFamily> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForThePerson> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForThePlaceOrGeographicName> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheSubjectHeading> )
            ( <https://d-nb.info/standards/elementset/gnd#preferredNameForTheWork> )
            ( <https://d-nb.info/standards/elementset/gnd#surname> )
            ( <https://d-nb.info/standards/elementset/gnd#SubjectHeadingSensoStricto>)
            ( <https://d-nb.info/standards/elementset/gnd#variantNameForTheConferenceOrEvent> )
            ( <https://d-nb.info/standards/elementset/gnd#variantNameForTheCorporateBody> )
            ( <https://d-nb.info/standards/elementset/gnd#variantNameForTheFamily> )
            ( <https://d-nb.info/standards/elementset/gnd#variantNameForThePerson> )
            ( <https://d-nb.info/standards/elementset/gnd#variantNameForThePlaceOrGeographicName> )
            ( <https://d-nb.info/standards/elementset/gnd#variantNameForTheSubjectHeading> )
            ( <https://d-nb.info/standards/elementset/gnd#variantNameForTheWork> )
        }
      matches: |
        ?subject ?predicate ?value .
        VALUES (?predicate) {
          (schema:sameAs)
          (rdfs:seeAlso)
          (skos:exactMatch)
        }

  sikart:
    graph: http://recherche.sik-isea.ch/graph
    prefixes:
      crm: http://www.cidoc-crm.org/cidoc-crm/
      crmdig: http://www.ics.forth.gr/isl/CRMdig/
      rdfs: http://www.w3.org/2000/01/rdf-schema#
      sik: https://recherche.sik-isea.ch
    types:
      Artwork:
        - sik:SIK-WORK
        - sik:SIK-WORK_GROUP
        - sik:SIK-PARENT_WORK
      BibliographicItem:
        - sik:SIK-DOCUMENT
        - sik:SIK-PUBLICATION
        - sik:SIK-PARENT_DOCUMENT
      Event:
        - sik:SIK-EXHIBITION
        - sik:SIK-AWARD_CEREMONY
      Person:
        - sik:SIK-ACTOR
      Place: 
        - crm:E53_Place
      Type:
        - sik:SIK-TYPE
    queries:
      description: |
        BIND("" AS ?value) .
      prefLabel: |
        ?subject crm:P1_is_identified_by/rdfs:label ?value .
      labels: |
        ?subject crm:P1_is_identified_by/rdfs:label ?value .
      matches:
        ?subject crmdig:L54_is_same-as ?value .


  thesarchesp:
    graph: http://data.culture.fr/thesaurus/resource/ark:/67717/T96/graph
    prefixes:
      skos: http://www.w3.org/2004/02/skos/core#
    types:
      Type:
        - skos:Concept
    queries:
      description: |
        ?subject skos:definition ?value .
      prefLabel: |
        ?subject skos:prefLabel ?value .
      labels: |
        ?subject (skos:prefLabel | skos:altLabel) ?value .
      matches: |
        ?subject skos:exactMatch ?value .

  thesobjmob:
    graph: http://data.culture.fr/thesaurus/resource/ark:/67717/T69/graph
    prefixes:
      skos: http://www.w3.org/2004/02/skos/core#
    types:
      Type:
        - skos:Concept
    queries:
      description: |
        ?subject skos:definition ?value .
      prefLabel: |
        ?subject skos:prefLabel ?value .
      labels: |
        ?subject (skos:prefLabel | skos:altLabel) ?value .
      matches: |
        ?subject skos:exactMatch ?value .

  ulan:
    graph: http://vocab.getty.edu/ulan/graph
    namespace: http://vocab.getty.edu/ulan/
    prefixes:
      gvp: http://vocab.getty.edu/ontology#
      skos: http://www.w3.org/2004/02/skos/core#
      xl: http://www.w3.org/2008/05/skos-xl#
    types:
      Person:
        - gvp:PersonConcept
        - gvp:UnknownPersonConcept
    queries:
      description: |
        ?subject gvp:parentStringAbbrev ?value .
      prefLabel: |
        ?subject gvp:prefLabelGVP/xl:literalForm ?value .
      labels: |
        ?subject (gvp:prefLabelGVP | xl:prefLabel | xl:altLabel)/xl:literalForm ?value .
      matches: |
        ?subject (skos:exactMatch | skos:closeMatch) ?value .
    wikidata_match_property: P245