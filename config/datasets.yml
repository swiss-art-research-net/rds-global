datasets:

  aat:
    source:
      - url: http://aatdownloads.getty.edu/VocabData/explicit.zip
        process:
        - unzip
    graph: http://vocab.getty.edu/aat/graph
    namespace: http://vocab.getty.edu/aat/
    prefixes:
      gvp: http://vocab.getty.edu/ontology#
      skos: http://www.w3.org/2004/02/skos/core#
      xl: http://www.w3.org/2008/05/skos-xl#
    types:
      Type:
        - gvp:Concept
    queries:
      description: |
        ?subject gvp:parentStringAbbrev ?value .
      prefLabel: |
        ?subject gvp:prefLabelGVP/xl:literalForm ?value .
      labels: |
        ?subject (gvp:prefLabelGVP | xl:prefLabel | xl:altLabel)/xl:literalForm ?value .
      matches: |
        ?subject (skos:exactMatch | skos:closeMatch) ?value .
    wikidata_match_property: P1014

  geonames:
    source:
      - url: http://download.geonames.org/all-geonames-rdf.zip
        process:
          - unzip
          - rdfxml2nt
    graph: http://sws.geonames.org/graph
    namespace: https://sws.geonames.org/
    prefixes:
      gn: http://www.geonames.org/ontology#
      owl: http://www.w3.org/2002/07/owl#
      rdfs: http://www.w3.org/2000/01/rdf-schema#
    types:
      Place:
        - gn:Feature
    queries:
      description: |
        ?subject gn:name ?self .
        OPTIONAL { ?subject gn:parentADM4/gn:name ?adm4 }
        OPTIONAL { ?subject gn:parentADM3/gn:name ?adm3 }
        OPTIONAL { ?subject gn:parentADM2/gn:name ?adm2 }
        OPTIONAL { ?subject gn:parentADM1/gn:name ?adm1 }
        OPTIONAL { ?subject gn:parentCountry/gn:name ?country }
        OPTIONAL { ?subject gn:parentFeature/gn:name ?feature }
        BIND(CONCAT(
          ?self,
          IF(BOUND(?adm4), CONCAT(", ", ?adm4), ""),
          IF(BOUND(?adm3), CONCAT(", ", ?adm3), ""),
          IF(BOUND(?adm2), CONCAT(", ", ?adm2), ""),
          IF(BOUND(?adm1), CONCAT(", ", ?adm1), ""),
          IF(BOUND(?country), CONCAT(", ", ?country), "")
        ) AS ?value)
      prefLabel: |
        ?subject gn:name ?value .
      labels: |
        ?subject gn:alternateName ?value .
      matches: |
        ?subject owl:sameAs|rdfs:seeAlso ?value .
    wikidata_match_property: P1566

  gnd:
    source:
      - type: http_file
        url: https://data.dnb.de/opendata/authorities-gnd_lds.nt.gz
        process:
          - gunzip   
      - type: http_file
        url: https://raw.githubusercontent.com/deutsche-nationalbibliothek/gnd-ontology/refs/heads/main/source/gnd.ttl
        file_format: ttl
    graph: https://d-nb.info/gnd/authorities/graph
    namespace: https://d-nb.info/gnd/
    prefixes:
      gnd: https://d-nb.info/standards/elementset/gnd#
      rdfs: http://www.w3.org/2000/01/rdf-schema#
      schema: http://schema.org/
      skos: http://www.w3.org/2004/02/skos/core#
    types:
      BibliographicItem:
        - gnd:Work
      Event:
        - gnd:ConferenceOrEvent
      Group:
        - gnd:CorporateBody
      Person:
        - gnd:Person
      Place:
        - gnd:PlaceOrGeographicName
      Type:
        - gnd:SubjectHeading
    queries:
      description: |
            OPTIONAL {
              ?subject ?p ?bio .
              VALUES ?p { gnd:definition gnd:note gnd:biographicalOrHistoricalInformation }
              FILTER (STRLEN(STR(?bio)) > 0)
            }
            OPTIONAL {
              ?subject gnd:professionOrOccupationAsLiteral ?profession .
              FILTER (STRLEN(STR(?prof)) > 0)
            }
            OPTIONAL {
              ?subject gnd:dateOfBirth ?birthDate
            }
            OPTIONAL {
              ?subject gnd:dateOfDeath ?deathDate
            }
            OPTIONAL {
              ?subject gnd:placeOfBirth/gnd:preferredNameForThePlaceOrGeographicName ?birthPlace
            }
            OPTIONAL {
              ?subject gnd:placeOfDeath/gnd:preferredNameForThePlaceOrGeographicName ?deathPlace
            }
            BIND (CONCAT(COALESCE(?bio, ""), IF(STRLEN(COALESCE(?profession, "")) > 0,CONCAT(IF(STRLEN(COALESCE(?bio, "")) > 0," ",""), ?profession),""), IF(BOUND(?birthDate) || BOUND(?birthPlace) || BOUND(?deathDate) || BOUND(?deathPlace),CONCAT(IF(STRLEN(CONCAT(COALESCE(?bio, ""), COALESCE(?profession, ""))) > 0," ",""), "(", COALESCE(STR(?birthDate), ""), IF(BOUND(?birthPlace),CONCAT(", ", ?birthPlace),""), " – ", COALESCE(STR(?deathDate), ""), IF(BOUND(?deathPlace),CONCAT(", ", ?deathPlace),""), ")"),"")) AS ?value)
      prefLabel: |
        ?subject ?predicatePrefLabel ?value .
        ?predicatePrefLabel rdfs:subPropertyOf gnd:preferredName .
      labels: |
        ?subject ?predicatePrefLabel ?value .
        ?predicatePrefLabel rdfs:subPropertyOf gnd:variantName .
      types: |
        { ?subject a ?value } UNION { ?subject a/rdfs:subClassOf ?value } .
      matches: |
        ?subject ?predicate ?value .
        VALUES (?predicate) {
          (schema:sameAs)
          (rdfs:seeAlso)
          (skos:exactMatch)
        }
    wikidata_match_property: P227

  sikart:
    source:
      - type: github_zip
        repository: swiss-art-research-net/sikart-data
        path: source/SIK_20210616_2300.ttl.zip
        file_format: ttl
        process:
          - unzip
    file_format: ttl
    graph: http://recherche.sik-isea.ch/graph
    namespace: https://recherche.sik-isea.ch/person-
    prefixes:
      crm: http://www.cidoc-crm.org/cidoc-crm/
      crmdig: http://www.ics.forth.gr/isl/CRMdig/
      rdfs: http://www.w3.org/2000/01/rdf-schema#
      sik: https://recherche.sik-isea.ch/
    types:
      Artwork:
        - sik:SIK-WORK
        - sik:SIK-WORK_GROUP
        - sik:SIK-PARENT_WORK
      Person:
        - sik:SIK-ACTOR
      Type:
        - sik:SIK-TYPE
    queries:
      description: |
        BIND("" AS ?value) .
      prefLabel: |
        ?subject crm:P1_is_identified_by/rdfs:label ?value .
      labels: |
        ?subject crm:P1_is_identified_by/rdfs:label ?value .
      matches:
        ?subject crmdig:L54_same_as ?value .
    wikidata_match_property: P781


  thesarchesp:
    source:
      - url: http://data.culture.fr/thesaurus/data/ark:/67717/T96?includeSchemes=true&format=TURTLE
        type: http_file
        file_format: ttl
    file_format: ttl
    graph: http://data.culture.fr/thesaurus/resource/ark:/67717/T96/graph
    prefixes:
      skos: http://www.w3.org/2004/02/skos/core#
    types:
      Type:
        - skos:Concept
    queries:
      description: |
        ?subject skos:definition ?value .
      prefLabel: |
        ?subject skos:prefLabel ?value .
      labels: |
        ?subject (skos:prefLabel | skos:altLabel) ?value .
      matches: |
        ?subject skos:exactMatch ?value .

  thesobjmob:
    source:
      - url: http://data.culture.fr/thesaurus/data/ark:/67717/T69?includeSchemes=true&format=TURTLE
        type: http_file
        file_format: ttl
    file_format: ttl
    graph: http://data.culture.fr/thesaurus/resource/ark:/67717/T69/graph
    prefixes:
      skos: http://www.w3.org/2004/02/skos/core#
    types:
      Type:
        - skos:Concept
    queries:
      description: |
        ?subject skos:definition ?value .
      prefLabel: |
        ?subject skos:prefLabel ?value .
      labels: |
        ?subject (skos:prefLabel | skos:altLabel) ?value .
      matches: |
        ?subject skos:exactMatch ?value .

  ulan:
    source:
      - url: http://ulandownloads.getty.edu/VocabData/full.zip
        process:
          - unzip
    graph: http://vocab.getty.edu/ulan/graph
    namespace: http://vocab.getty.edu/ulan/
    prefixes:
      gvp: http://vocab.getty.edu/ontology#
      skos: http://www.w3.org/2004/02/skos/core#
      xl: http://www.w3.org/2008/05/skos-xl#
    types:
      Person:
        - gvp:PersonConcept
        - gvp:UnknownPersonConcept
    queries:
      description: |
        ?subject gvp:parentStringAbbrev ?value .
      prefLabel: |
        ?subject gvp:prefLabelGVP/xl:literalForm ?value .
      labels: |
        ?subject (gvp:prefLabelGVP | xl:prefLabel | xl:altLabel)/xl:literalForm ?value .
      matches: |
        ?subject (skos:exactMatch | skos:closeMatch) ?value .
    wikidata_match_property: P245